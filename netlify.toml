[build]
  publish = "."
  command = ""

# games.harleysays.com is a short address for the word games at harleysays.com/games/
[[redirects]]
  from = "https://games.harleysays.com/*"
  to = "https://harleysays.com/games/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://games.harleysays.com/*"
  to = "https://harleysays.com/games/:splat"
  status = 301
  force = true

# interview.harleysays.com is a short address for Harley's Interview Coach at harleysays.com/interview/
[[redirects]]
  from = "https://interview.harleysays.com/*"
  to = "https://harleysays.com/interview/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://interview.harleysays.com/*"
  to = "https://harleysays.com/interview/:splat"
  status = 301
  force = true

