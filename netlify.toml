[build]
  publish = "."
  command = ""

# Harlo lives at harlolearn.com (formerly Harley Says at harleysays.com).
# Every old or extra address is sent to harlolearn.com, keeping the page path.

# Short addresses for the games and Interview Coach

[[redirects]]
  from = "https://games.harleysays.com/*"
  to = "https://harlolearn.com/games/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://games.harleysays.com/*"
  to = "https://harlolearn.com/games/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://interview.harleysays.com/*"
  to = "https://harlolearn.com/interview/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://interview.harleysays.com/*"
  to = "https://harlolearn.com/interview/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://games.harlolearn.com/*"
  to = "https://harlolearn.com/games/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://games.harlolearn.com/*"
  to = "https://harlolearn.com/games/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://interview.harlolearn.com/*"
  to = "https://harlolearn.com/interview/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://interview.harlolearn.com/*"
  to = "https://harlolearn.com/interview/:splat"
  status = 301
  force = true

# Old domains: serve move.html (on the old address) so people's saved progress and sign-in come with them,
# then it sends them on to harlolearn.com. http goes to https first, because storage differs between the two.

[[redirects]]
  from = "http://harleysays.com/*"
  to = "https://harleysays.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://harleysays.com/*"
  to = "/move.html"
  status = 200
  force = true

[[redirects]]
  from = "http://www.harleysays.com/*"
  to = "https://www.harleysays.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.harleysays.com/*"
  to = "/move.html"
  status = 200
  force = true

[[redirects]]
  from = "http://harleysays.co.uk/*"
  to = "https://harleysays.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://harleysays.co.uk/*"
  to = "/move.html"
  status = 200
  force = true

[[redirects]]
  from = "http://www.harleysays.co.uk/*"
  to = "https://www.harleysays.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.harleysays.co.uk/*"
  to = "/move.html"
  status = 200
  force = true

[[redirects]]
  from = "https://harleysays.netlify.app/*"
  to = "/move.html"
  status = 200
  force = true

