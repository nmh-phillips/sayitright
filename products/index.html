<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Everything in Harlo — pronunciation, games, interviews, Life in the UK and travel</title>
<meta name="description" content="All the Harlo apps in one place: Harlo Says pronunciation practice, word games, Interview Coach, Life in the UK test practice, travel phrases and English for work.">
<link rel="canonical" href="https://harlolearn.com/products/">
<meta property="og:type" content="website"><meta property="og:site_name" content="Harlo"><meta property="og:url" content="https://harlolearn.com/products/">
<meta property="og:title" content="Everything in Harlo"><meta property="og:description" content="Pronunciation, word games, interview practice, Life in the UK test practice and travel phrases.">
<meta property="og:image" content="https://harlolearn.com/icons/og-image.png"><meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#1C2563">
<link rel="stylesheet" href="/fonts/inter.css">
<style>
  :root{--ink:#1C2563;--muted:#5b6475;--line:#e3e6f2;--bg:#F4F5FF}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  header{background:#1C2563;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  header a.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:18px}
  header a.brand svg{width:34px;height:34px;flex:0 0 auto}
  header select{font:700 14px Inter,sans-serif;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:7px 10px;max-width:46vw}
  header select option{color:#1C2563}
  .hero{background:linear-gradient(160deg,#3346C8,#6C7BFF 60%,#A78BFA);color:#fff;padding:26px 18px 54px;text-align:center}
  .hero h1{margin:0 0 6px;font-size:28px;line-height:1.15}
  .hero p{margin:0 auto;max-width:440px;font-size:15px;opacity:.95}
  main{max-width:720px;margin:-36px auto 0;padding:0 14px 24px}
  .grid{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
  .app{position:relative;display:flex;gap:14px;align-items:center;padding:16px;border-radius:22px;color:#fff;text-decoration:none;background:linear-gradient(150deg,var(--c1),var(--c2));
    box-shadow:0 5px 0 rgba(0,0,0,.15),0 12px 24px rgba(28,37,99,.12);transition:transform .12s;animation:in .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*55ms)}
  a.app:active{transform:translateY(2px) scale(.98)}
  .app .ic{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:rgba(255,255,255,.25)}
  .app .tx{min-width:0;flex:1}
  .app b{display:block;font-size:18px;line-height:1.2}
  .app span.d{display:block;font-size:13.5px;opacity:.95;margin-top:3px;line-height:1.35}
  .app .go{flex:none;width:36px;height:36px;border-radius:50%;background:#fff;color:var(--c1);display:grid;place-items:center;font-weight:900;font-size:18px}
  .app .tag{position:absolute;top:10px;right:12px;font-size:11px;font-weight:800;background:#fff;color:var(--c1);border-radius:999px;padding:3px 9px}
  .app.off{filter:saturate(.75);opacity:.9}
  .app.off .tx,.app.tagged .tx{padding-top:16px}
  @keyframes in{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.app{animation:none}}
  footer{text-align:center;padding:20px 16px 34px;color:var(--muted);font-size:13px}
  footer a{color:#3346C8;text-decoration:none;font-weight:600;margin:0 8px}
  [dir=rtl] .app .tag{right:auto;left:12px}
</style>
</head>
<body>
<header>
  <a class="brand" href="/?from=products" dir="ltr"><svg width="34" height="34" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="10" width="280" height="280" rx="64" fill="#3346C8"/><path d="M92 228 l-26 40 l52 -24 z" fill="#fff"/><circle cx="212" cy="148" r="33" fill="#fff"/><circle cx="200" cy="184" r="33" fill="#fff"/><circle cx="169" cy="207" r="33" fill="#fff"/><circle cx="131" cy="207" r="33" fill="#fff"/><circle cx="100" cy="184" r="33" fill="#fff"/><circle cx="88" cy="148" r="33" fill="#fff"/><circle cx="100" cy="112" r="33" fill="#fff"/><circle cx="131" cy="89" r="33" fill="#fff"/><circle cx="169" cy="89" r="33" fill="#fff"/><circle cx="200" cy="112" r="33" fill="#fff"/><circle cx="150" cy="148" r="70" fill="#fff"/><circle cx="125" cy="138" r="9" fill="#1C2563"/><circle cx="175" cy="138" r="9" fill="#1C2563"/><circle cx="128" cy="135" r="3" fill="#fff"/><circle cx="178" cy="135" r="3" fill="#fff"/><ellipse cx="150" cy="163" rx="13" ry="9" fill="#1C2563"/><path d="M143 180 q7 16 14 0 z" fill="#F07C92"/><path d="M150 171 q-10 14 -22 4 M150 171 q10 14 22 4" fill="none" stroke="#1C2563" stroke-width="4" stroke-linecap="round"/></svg><span>Harlo<sup style="font-size:.5em;font-weight:600">™</sup></span></a>
  <select id="ui" aria-label="Language"></select>
</header>
<section class="hero"><h1 id="h"></h1><p id="sub"></p></section>
<main><div class="grid" id="grid"></div></main>
<footer><a href="/">Harlo Says</a><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><p>For adults aged 18 and over.</p><p style="font-size:12px;opacity:.7;margin:6px 0 0">Harlo™ is a trade mark of NMH Phillips Consulting Ltd.</p></footer>
<script src="/apps.js"></script>
<script>
(function(){
  const NAMES={en:'English',es:'Español',fr:'Français',it:'Italiano',de:'Deutsch',pt:'Português',pl:'Polski',ro:'Română',uk:'Українська',zh:'中文',ar:'العربية',nl:'Nederlands',tr:'Türkçe',ja:'日本語',ko:'한국어',vi:'Tiếng Việt'};
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const sel=document.getElementById('ui');
  let ui=HS_APPS.lng();
  try{ if(!localStorage.getItem('sir_ui')){ const b=(navigator.language||'en').slice(0,2); if(NAMES[b]) ui=b; } }catch(e){}
  HS_APPS.langs.forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=NAMES[k]||k; sel.appendChild(o); });
  function draw(){
    sel.value=ui; document.documentElement.lang=ui; document.documentElement.dir=ui==='ar'?'rtl':'ltr';
    document.getElementById('h').textContent=HS_APPS.t('allTitle',ui);
    document.getElementById('sub').textContent=HS_APPS.t('allSub',ui);
    document.getElementById('grid').innerHTML=HS_APPS.list(ui).map((a,i)=>{
      const tag=a.status?`<span class="tag">${esc(a.id==='chats'?HS_APPS.t('partOf',ui)+' · '+HS_APPS.t('beta',ui):HS_APPS.t(a.status,ui))}</span>`:'';
      const inner=`<span class="ic" aria-hidden="true">${a.ic}</span><span class="tx"><b>${esc(a.id==='says'?a.name:'Harlo '+a.name)}</b><span class="d">${esc(a.desc)}</span></span>`;
      const part=a.id==='work'?`<span class="tag">${esc(HS_APPS.t('partOf',ui))}</span>`:'';
      return a.href ? `<a class="app${part?' tagged':''}" href="${esc(a.href)}" style="--c1:${a.c1};--c2:${a.c2};--i:${i}">${part}${inner}<span class="go" aria-hidden="true">→</span></a>`
                    : `<div class="app off" style="--c1:${a.c1};--c2:${a.c2};--i:${i}">${tag}${inner}</div>`;
    }).join('');
  }
  sel.onchange=()=>{ ui=sel.value; try{ localStorage.setItem('sir_ui',JSON.stringify(ui)); }catch(e){} draw(); };
  draw();
})();
</script>
</body>
</html>
