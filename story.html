<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Why we built Harlo</title>
<meta name="description" content="The story behind Harlo, and the real Harley and Lilou.">
<link rel="canonical" href="https://harlolearn.com/story.html">
<meta property="og:title" content="Why we built Harlo">
<meta property="og:description" content="The story behind Harlo, and the real Harley and Lilou.">
<meta property="og:image" content="https://harlolearn.com/harley-lilou.jpg">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#1C2563">
<link rel="stylesheet" href="/fonts/inter.css">
<style>
  :root{--ink:#1C2563}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;background:#1C2563}
  .top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px}
  .top a{color:#fff;text-decoration:none;font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);padding:7px 12px;border-radius:999px}
  .dots{display:flex;gap:6px}
  .dots i{width:8px;height:8px;border-radius:8px;background:rgba(255,255,255,.4);transition:width .3s,background .3s}
  .dots i.on{width:22px;background:#fff}
  .track{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .track::-webkit-scrollbar{display:none}
  .slide{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:center;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 64px) 22px calc(env(safe-area-inset-bottom) + 96px);text-align:center}
  .slide .in-wrap{position:relative;z-index:1;max-width:520px;width:100%;display:flex;flex-direction:column;align-items:center}
  .s1{background:linear-gradient(165deg,#3346C8,#6C7BFF)} .s2{background:linear-gradient(165deg,#0E9F9A,#2DD4BF)} .s3{background:linear-gradient(165deg,#7B2FD0,#C07CF2)}
  .s4{background:linear-gradient(165deg,#E0457B,#FF9BBB)} .s5{background:linear-gradient(165deg,#FF8A3D,#FFC46B)}
  h1,h2{margin:14px 0 10px;font-size:clamp(24px,6.5vw,32px);line-height:1.15;letter-spacing:-.01em;text-shadow:0 2px 6px rgba(0,0,0,.12)}
  p{margin:0;font-size:clamp(17px,4.6vw,20px);line-height:1.55;max-width:30em;text-shadow:0 1px 2px rgba(0,0,0,.1)}
  .head{width:min(190px,48vw);aspect-ratio:1;filter:drop-shadow(0 10px 18px rgba(10,15,60,.3))}
  .head svg{width:100%;height:100%;display:block;overflow:visible}
  .pair{display:flex;align-items:flex-end;justify-content:center;gap:4px}
  .pair .head.small{width:min(140px,34vw)}
  .bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .bubbles span{position:absolute;bottom:-40px;white-space:nowrap;background:#fff;color:var(--ink);font-weight:800;font-size:13px;padding:6px 10px;border-radius:16px 16px 16px 4px;box-shadow:0 6px 14px rgba(0,0,0,.12);animation:rise linear infinite;opacity:.55}
  @keyframes rise{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-110vh) rotate(4deg)}}
  .phone{position:relative;width:120px;height:210px;border-radius:26px;background:#fff;box-shadow:0 14px 30px rgba(0,0,0,.2);display:grid;place-items:center}
  .phone::before{content:'';position:absolute;top:10px;width:40px;height:6px;border-radius:6px;background:#e3e6ec}
  .phone .mic{width:64px;height:64px;border-radius:50%;background:#3346C8;display:grid;place-items:center;font-size:30px;animation:pulse 1.6s ease-in-out infinite}
  .waves{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .waves i{position:absolute;width:64px;height:64px;border-radius:50%;border:3px solid #fff;opacity:0;animation:wave 2.4s ease-out infinite}
  .waves i:nth-child(2){animation-delay:.8s}.waves i:nth-child(3){animation-delay:1.6s}
  @keyframes wave{from{transform:scale(1);opacity:.8}to{transform:scale(3.4);opacity:0}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .badges{display:flex;gap:10px;justify-content:center;margin:18px 0 4px;flex-wrap:wrap}
  .badges span{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:26px}
  .hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .hearts span{position:absolute;bottom:-30px;font-size:24px;animation:rise linear infinite}
  .bob{animation:bob 2.6s ease-in-out infinite} .wag{animation:wag 1.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes wag{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  /* things that animate in when a slide arrives */
  .slide .a{opacity:0;transform:translateY(18px) scale(.97);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
  .slide.in .a{opacity:1;transform:none}
  .slide.in .a:nth-child(2){transition-delay:.15s}.slide.in .a:nth-child(3){transition-delay:.3s}.slide.in .a:nth-child(4){transition-delay:.45s}.slide.in .a:nth-child(5){transition-delay:.6s}
  .slide .pop{opacity:0;transform:scale(.4)}
  .slide.in .pop{opacity:1;transform:none;transition:opacity .4s ease,transform .55s cubic-bezier(.3,1.6,.5,1)}
  .slide.in .badges span:nth-child(1){transition-delay:.5s}.slide.in .badges span:nth-child(2){transition-delay:.65s}.slide.in .badges span:nth-child(3){transition-delay:.8s}
  .slide.in .pair .lilou{transition-delay:.55s}
  /* photos */
  .photos{position:relative;width:100%;max-width:440px;height:clamp(340px,92vw,460px);margin:4px 0 14px}
  .ph{position:absolute;margin:0;background:#fff;padding:8px 8px 30px;border-radius:6px;box-shadow:0 12px 28px rgba(0,0,0,.22);color:var(--ink);opacity:0;transform:translateY(-60px) rotate(0) scale(.9)}
  .ph img{display:block;width:100%;height:100%;object-fit:cover;border-radius:3px}
  .ph figcaption{position:absolute;left:0;right:0;bottom:7px;font:600 13px Inter,sans-serif;text-align:center}
  .ph.p1{left:0;top:0;width:58%;height:45%} .ph.p2{right:0;top:3%;width:44%;height:45%} .ph.p3{left:10%;bottom:0;width:80%;height:46%}
  .slide.in .ph{opacity:1;transition:opacity .5s ease,transform .8s cubic-bezier(.2,1.3,.4,1)}
  .slide.in .ph.p1{transform:rotate(-6deg);transition-delay:.2s} .slide.in .ph.p2{transform:rotate(5deg);transition-delay:.7s} .slide.in .ph.p3{transform:rotate(-2deg);transition-delay:1.2s}
  .ph img.kb{animation:kb 9s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
  .ph{overflow:hidden}
  .sig{font-style:italic;margin-top:10px;font-size:18px;opacity:.95}
  .cta{display:inline-block;margin-top:16px;background:#fff;color:#d9531e;font-weight:800;font-size:18px;text-decoration:none;padding:15px 26px;border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px calc(env(safe-area-inset-bottom) + 14px)}
  .nav button{border:0;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--ink);font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
  .nav button:disabled{opacity:0;pointer-events:none}
  .nav .hint{flex:1;text-align:center;font-size:13px;opacity:.9}
  .nav #next{animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
  html[dir=rtl] .nav #next{animation:none}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.slide .a,.slide .pop,.ph{opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<div class="top"><a href="/" id="home">← <span id="homeT">Harlo</span></a><div class="dots" id="dots"></div></div>
<div class="track" id="track">
  <section class="slide s1"><div class="bubbles" id="bubbles" aria-hidden="true"></div><div class="in-wrap">
    <div class="head bob a" id="h1"></div><h1 class="a" data-k="storyH"></h1><p class="a" data-k="story1"></p></div></section>
  <section class="slide s2"><div class="in-wrap">
    <div class="phone a" aria-hidden="true"><div class="waves"><i></i><i></i><i></i></div><div class="mic">🎙️</div></div>
    <div class="badges" aria-hidden="true"><span class="pop">🆓</span><span class="pop">⏱️</span><span class="pop">💬</span></div>
    <p class="a" data-k="story2"></p></div></section>
  <section class="slide s3"><div class="hearts" id="hearts" aria-hidden="true"></div><div class="in-wrap">
    <div class="head wag a" id="h3"></div><h2 class="a" data-k="whyH"></h2><p class="a" data-k="story3"></p></div></section>
  <section class="slide s4"><div class="in-wrap">
    <div class="pair a" aria-hidden="true"><div class="head small bob" id="h4a"></div><div class="head small lilou pop wag" id="h4b"></div></div>
    <p class="a" data-k="story4" style="margin-top:14px"></p></div></section>
  <section class="slide s5"><div class="in-wrap">
    <h2 class="a" data-k="st_real"></h2>
    <div class="photos">
      <figure class="ph p1"><img class="kb" src="harley.jpg" alt="Harley, a white bichon frise, running happily across a grassy field"><figcaption data-k="cap1"></figcaption></figure>
      <figure class="ph p2"><img class="kb" src="harley-ball.jpg" alt="Harley looking up with a tennis ball in his mouth" style="object-position:50% 30%"><figcaption data-k="cap2"></figcaption></figure>
      <figure class="ph p3"><img class="kb" src="harley-lilou.jpg" alt="Harley and his little cousin Lilou side by side in a dog buggy in the park"><figcaption data-k="cap3"></figcaption></figure>
    </div>
    <div class="sig a">Neil</div>
    <a class="cta a" href="/" data-k="st_cta"></a></div></section>
</div>
<div class="nav"><button id="prev" aria-label="Back">←</button><span class="hint" id="hint"></span><button id="next" aria-label="Next">→</button></div>

<script src="/i18n.js"></script>
<script>
(function(){ var pick; try{ pick = JSON.parse(localStorage.getItem('sir_ui')||'null'); }catch(e){}
  if(!pick){ pick = ((navigator.languages&&navigator.languages[0])||navigator.language||'en').toLowerCase().split('-')[0]; }
  window.STORY_UI = pick;
  if(window.SIR_EXTRA[pick] && !window.SIR_UI[pick]) document.write('<script src="/i18n/'+pick+'.js"><\/script>');
})();
</script>
<script src="/talkhead.js"></script>
<script src="/story.js"></script>
</body>
</html>
